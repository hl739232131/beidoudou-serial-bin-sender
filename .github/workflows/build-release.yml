name: Build Windows EXE and Release

on:
  # 推送以 v 开头的 tag 时自动打包并发布 Release
  push:
    tags:
      - 'v*'

  # 支持手动触发，方便测试打包而不发布 Release
  workflow_dispatch:
    inputs:
      release:
        description: '是否发布 Release（只在手动触发时有效）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerialBinSender-windows
          path: dist/SerialBinSender.exe

      - name: Create Release (tag push only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SerialBinSender.exe
          generate_release_notes: true

      - name: Create Release (manual trigger with release=true)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SerialBinSender.exe
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
